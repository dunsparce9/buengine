<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>büengine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+HR+Lijeva:wght@100..400&amp;display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/material-symbols-outlined.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/material-symbols.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <!-- Scene layer: background + clickable objects -->
    <div id="scene-layer">
      <div id="grid-overlay" class="hidden"></div>
    </div>

    <!-- UI overlay layer: title, pause, dialogues, choices -->
    <div id="ui-layer">
      <div id="game-selector" class="overlay hidden">
        <div class="overlay-content selector-content">
          <header class="selector-brand">
            <img class="selector-brand-logo" src="assets/images/seal.png" alt="">
            <div class="selector-brand-copy">
              <h1>büengine</h1>
              <p>2D point'n'click storyteller</p>
            </div>
          </header>

          <div class="selector-separator"><span>Enter the editor</span></div>

          <button id="editor-entry" class="game-entry" type="button">
            <span class="game-entry-icon material-symbols-outlined" aria-hidden="true">edit_square</span>
            <span class="game-entry-copy">
              <span class="game-entry-title">büengine editor</span>
              <span class="game-entry-subtitle">Open the level editor.</span>
            </span>
          </button>

          <div class="selector-separator"><span>Or try these games</span></div>
          <p class="selector-intro">Below are some great games developed by our prized büengineers.</p>
          <div id="game-list"></div>
        </div>
      </div>

      <div id="title-screen" class="overlay hidden">
        <div class="overlay-content title-content">
          <header class="title-brand">
            <span class="title-brand-icon material-symbols-outlined" aria-hidden="true">stadia_controller</span>
            <div class="title-brand-copy">
              <h1 id="title-text"></h1>
              <p id="title-subtitle"></p>
            </div>
          </header>

          <button id="title-start-btn" class="btn title-start-btn" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
            <span>Start</span>
          </button>
        </div>
      </div>

      <div id="pause-screen" class="overlay hidden">
        <div class="overlay-content">
          <h2>Paused</h2>
          <button id="pause-resume-btn" class="btn">Resume</button>
          <button id="pause-title-btn" class="btn">Title Screen</button>
        </div>
      </div>

      <div id="dialogue-box" class="hidden">
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-advance-hint" class="hidden"></div>
      </div>

      <div id="choice-modal" class="overlay hidden">
        <div id="choice-prompt"></div>
        <div id="choice-list"></div>
      </div>

      <div id="hud-bar" class="hidden">
        <button class="hud-btn" data-hud="charsheet" title="Character sheet" aria-label="Character sheet"><span class="material-symbols-outlined">badge</span></button>
        <button class="hud-btn" data-hud="inventory" title="Inventory" aria-label="Inventory"><span class="material-symbols-outlined">inventory_2</span></button>
        <span class="hud-separator"></span>
        <button class="hud-btn" data-hud="settings" title="Settings" aria-label="Settings"><span class="material-symbols-outlined">settings</span></button>
        <button class="hud-btn" data-hud="quit" title="Quit" aria-label="Quit"><span class="material-symbols-outlined">close</span></button>
      </div>

      <div id="notification-container"></div>

      <div id="debug-box" class="hidden">
        <div id="debug-tile">Tile: —, —</div>
        <div id="debug-object">Object: —</div>
        <div id="debug-scene">Scene: —</div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
